[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
repository = "https://github.com/byo-chat/byo-chat"
publish = false

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_qualifications = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
default = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
wildcard_enum_match_arm = "deny"
string_slice = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
tests_outside_test_module = "deny"
exit = "deny"
mem_forget = "deny"
clone_on_ref_ptr = "deny"
str_to_string = "deny"
mod_module_files = "deny"
# noise: fires on every pure fn; #[must_use] goes where ignoring the value is a bug
must_use_candidate = "allow"
# noise: docs on the public API are for a published library; byo-chat publishes none
missing_errors_doc = "allow"
