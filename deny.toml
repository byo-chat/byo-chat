  { name = "byo-store", wrappers = [
    "byo-chat",
  ] },
  { name = "byo-chatwoot", wrappers = [
    "byo-chat",
  ] },
  { name = "byo-webhook", wrappers = [
    "byo-chat",
  ] },
  { name = "byo-system", wrappers = [
    "byo-chat",
  ] },
  { name = "byo-mcp", wrappers = [
    "byo-chat",
  ] },
  { name = "byo-http", wrappers = [
    "byo-chat",
  ] },
]

[sources]
